name: Data availability canaries

on:
  workflow_dispatch:
  schedule:
    # Friday during the NFL regular/postseason months.
    - cron: "0 12 * 9-12,1 5"
  push:
    paths:
      - "tests/test_data_availability.py"
      - "requirements.txt"
      - "DATA_SOURCES.md"
      - "PROJECT_SPEC.md"
      - ".github/workflows/data-canaries.yml"

jobs:
  canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live data canaries
        run: pytest tests/test_data_availability.py -v

      - name: Upload data vintage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-vintage
          path: data_vintage.json
          if-no-files-found: ignore
